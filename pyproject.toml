[project]
name = "edinet-pit-dataset"
version = "0.1.0"
description = "Point-in-Time EDINET financial & text-feature dataset pipeline for quantitative research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "polars>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
colab = [
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edinet_pit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
